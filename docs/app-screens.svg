<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
  <title id="title">Gestor de Tareas ICE - pantallas principales</title>
  <desc id="desc">Wireframe visual basado en Material UI para dashboard, formulario, panel de IA, edicion manual y tarea confirmada.</desc>
  <style>
    .bg { fill: #f6f8fb; }
    .screen { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1.5; rx: 8; }
    .appbar { fill: #1565c0; }
    .rail { fill: #263238; }
    .paper { fill: #ffffff; stroke: #d8dee4; stroke-width: 1; rx: 8; }
    .surface { fill: #f9fafb; stroke: #e0e6ed; stroke-width: 1; rx: 8; }
    .input { fill: #ffffff; stroke: #90a4ae; stroke-width: 1.2; rx: 4; }
    .button { fill: #1565c0; rx: 4; }
    .buttonSecondary { fill: #ffffff; stroke: #1565c0; stroke-width: 1.2; rx: 4; }
    .fab { fill: #2e7d32; }
    .chipHigh { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1; rx: 8; }
    .chipMid { fill: #fff8e1; stroke: #f9a825; stroke-width: 1; rx: 8; }
    .chipLow { fill: #eceff1; stroke: #78909c; stroke-width: 1; rx: 8; }
    .ai { fill: #f3e5f5; stroke: #8e24aa; stroke-width: 1.2; rx: 8; }
    .success { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.2; rx: 8; }
    .alert { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.2; rx: 8; }
    .text { fill: #263238; font-family: Arial, sans-serif; font-size: 14px; }
    .muted { fill: #607d8b; font-family: Arial, sans-serif; font-size: 12px; }
    .small { fill: #607d8b; font-family: Arial, sans-serif; font-size: 11px; }
    .title { fill: #102027; font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #455a64; font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; }
    .white { fill: #ffffff; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; }
    .whiteSmall { fill: #ffffff; font-family: Arial, sans-serif; font-size: 12px; }
    .score { fill: #102027; font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; }
    .line { stroke: #d8dee4; stroke-width: 1; }
    .sliderTrack { stroke: #90a4ae; stroke-width: 4; stroke-linecap: round; }
    .sliderFill { stroke: #1565c0; stroke-width: 4; stroke-linecap: round; }
  </style>

  <rect class="bg" width="1440" height="1060"/>
  <text x="32" y="38" class="title">Gestor de Tareas ICE - estructura funcional y visual</text>
  <text x="32" y="58" class="muted">Material UI: AppBar, Paper, TextField, Slider, Chip, Alert, Snackbar, Buttons y FAB.</text>

  <!-- 01 Dashboard -->
  <g id="screen-dashboard" transform="translate(32 80)">
    <rect class="screen" width="656" height="430"/>
    <rect class="appbar" width="656" height="56" rx="8"/>
    <text x="24" y="34" class="white">Gestor de Tareas ICE</text>
    <text x="496" y="34" class="whiteSmall">Dashboard /</text>
    <rect class="rail" x="0" y="56" width="68" height="374"/>
    <circle cx="34" cy="92" r="13" fill="#90caf9"/>
    <rect x="22" y="126" width="24" height="4" rx="2" fill="#cfd8dc"/>
    <rect x="22" y="158" width="24" height="4" rx="2" fill="#78909c"/>
    <rect x="22" y="190" width="24" height="4" rx="2" fill="#78909c"/>
    <text x="92" y="92" class="title">Listado de tareas</text>
    <text x="92" y="114" class="muted">TaskDashboardPage con resumen y acciones principales</text>

    <rect class="surface" x="92" y="136" width="126" height="70"/>
    <text x="108" y="160" class="muted">Total</text>
    <text x="108" y="190" class="score">4</text>
    <rect class="surface" x="234" y="136" width="126" height="70"/>
    <text x="250" y="160" class="muted">Pendientes</text>
    <text x="250" y="190" class="score">3</text>
    <rect class="surface" x="376" y="136" width="196" height="70"/>
    <text x="392" y="160" class="muted">Mayor ICE</text>
    <text x="392" y="190" class="score">672</text>

    <rect class="paper" x="92" y="226" width="520" height="58"/>
    <text x="110" y="250" class="subtitle">Preparar presentacion</text>
    <text x="110" y="270" class="muted">ICE 336 - Pendiente</text>
    <rect class="chipMid" x="470" y="242" width="112" height="26"/>
    <text x="490" y="260" class="small">Prioridad media</text>

    <rect class="paper" x="92" y="296" width="520" height="58"/>
    <text x="110" y="320" class="subtitle">Validar demo con usuarios</text>
    <text x="110" y="340" class="muted">ICE 672 - Pendiente</text>
    <rect class="chipHigh" x="470" y="312" width="112" height="26"/>
    <text x="494" y="330" class="small">Alta prioridad</text>

    <rect class="paper" x="92" y="366" width="520" height="40"/>
    <text x="110" y="391" class="muted">EmptyState usa este espacio cuando no hay tareas</text>

    <circle class="fab" cx="600" cy="378" r="28"/>
    <text x="591" y="387" class="white" style="font-size:28px;">+</text>
  </g>

  <!-- 02 Task form -->
  <g id="screen-form" transform="translate(720 80)">
    <rect class="screen" width="688" height="430"/>
    <rect class="appbar" width="688" height="56" rx="8"/>
    <text x="24" y="34" class="white">Crear tarea</text>
    <text x="540" y="34" class="whiteSmall">/tasks/new</text>
    <text x="32" y="92" class="title">TaskFormDialog / TaskFormPage</text>
    <text x="32" y="114" class="muted">Formulario principal con campos Material UI</text>

    <rect class="input" x="32" y="140" width="300" height="54"/>
    <text x="48" y="160" class="small">TextField</text>
    <text x="48" y="181" class="text">Titulo de la tarea</text>

    <rect class="input" x="32" y="210" width="300" height="92"/>
    <text x="48" y="232" class="small">TextField multiline</text>
    <text x="48" y="255" class="text">Descripcion para IA</text>
    <text x="48" y="278" class="muted">Opcional para crear, requerida para IA</text>

    <text x="374" y="150" class="subtitle">Valores ICE manuales</text>
    <text x="374" y="184" class="muted">Impacto</text>
    <line class="sliderTrack" x1="456" y1="180" x2="626" y2="180"/>
    <line class="sliderFill" x1="456" y1="180" x2="578" y2="180"/>
    <circle cx="578" cy="180" r="8" fill="#1565c0"/>
    <text x="642" y="184" class="text">8</text>
    <text x="374" y="224" class="muted">Confianza</text>
    <line class="sliderTrack" x1="456" y1="220" x2="626" y2="220"/>
    <line class="sliderFill" x1="456" y1="220" x2="562" y2="220"/>
    <circle cx="562" cy="220" r="8" fill="#1565c0"/>
    <text x="642" y="224" class="text">7</text>
    <text x="374" y="264" class="muted">Facilidad</text>
    <line class="sliderTrack" x1="456" y1="260" x2="626" y2="260"/>
    <line class="sliderFill" x1="456" y1="260" x2="546" y2="260"/>
    <circle cx="546" cy="260" r="8" fill="#1565c0"/>
    <text x="642" y="264" class="text">6</text>

    <rect class="alert" x="32" y="322" width="624" height="38"/>
    <text x="48" y="346" class="muted">HelperText: la descripcion es necesaria para calcular ICE con IA</text>

    <rect class="buttonSecondary" x="32" y="378" width="170" height="36"/>
    <text x="55" y="401" class="text">Calcular ICE con IA</text>
    <rect class="buttonSecondary" x="216" y="378" width="92" height="36"/>
    <text x="242" y="401" class="text">Limpiar</text>
    <rect class="button" x="536" y="378" width="120" height="36"/>
    <text x="558" y="401" class="whiteSmall">Crear tarea</text>
  </g>

  <!-- 03 AI suggestion -->
  <g id="screen-ai" transform="translate(32 560)">
    <rect class="screen" width="430" height="420"/>
    <rect class="appbar" width="430" height="52" rx="8"/>
    <text x="20" y="32" class="white">Revision con IA</text>
    <text x="28" y="84" class="title">AiSuggestionPanel</text>
    <text x="28" y="106" class="muted">Estado posterior a Calcular ICE con IA</text>

    <rect class="ai" x="28" y="132" width="374" height="184"/>
    <text x="48" y="162" class="subtitle">Sugerencia recibida</text>
    <rect class="surface" x="48" y="184" width="92" height="78"/>
    <text x="62" y="210" class="muted">Impacto</text>
    <text x="75" y="246" class="score">8</text>
    <rect class="surface" x="164" y="184" width="92" height="78"/>
    <text x="176" y="210" class="muted">Confianza</text>
    <text x="191" y="246" class="score">7</text>
    <rect class="surface" x="280" y="184" width="92" height="78"/>
    <text x="296" y="210" class="muted">Facilidad</text>
    <text x="307" y="246" class="score">6</text>
    <text x="48" y="292" class="muted">Justificacion breve generada por IA</text>

    <rect class="surface" x="28" y="334" width="180" height="44"/>
    <circle cx="52" cy="356" r="10" fill="none" stroke="#1565c0" stroke-width="3"/>
    <text x="72" y="361" class="muted">LoadingState opcional</text>
    <rect class="buttonSecondary" x="224" y="334" width="78" height="36"/>
    <text x="244" y="357" class="text">Editar</text>
    <rect class="button" x="314" y="334" width="88" height="36"/>
    <text x="334" y="357" class="whiteSmall">Aceptar</text>
  </g>

  <!-- 04 Manual edit -->
  <g id="screen-manual" transform="translate(500 560)">
    <rect class="screen" width="430" height="420"/>
    <rect class="appbar" width="430" height="52" rx="8"/>
    <text x="20" y="32" class="white">Edicion manual</text>
    <text x="28" y="84" class="title">IceManualFields</text>
    <text x="28" y="106" class="muted">Alternativa cuando el usuario ajusta o falla la IA</text>

    <rect class="input" x="28" y="132" width="120" height="54"/>
    <text x="44" y="154" class="small">TextField</text>
    <text x="44" y="176" class="text">Impacto 8</text>
    <rect class="input" x="164" y="132" width="120" height="54"/>
    <text x="180" y="154" class="small">TextField</text>
    <text x="180" y="176" class="text">Conf. 7</text>
    <rect class="input" x="300" y="132" width="102" height="54"/>
    <text x="316" y="154" class="small">TextField</text>
    <text x="316" y="176" class="text">Fac. 6</text>

    <rect class="paper" x="28" y="212" width="374" height="92"/>
    <text x="48" y="242" class="subtitle">ICE calculado</text>
    <text x="48" y="282" class="score">336</text>
    <rect class="chipMid" x="274" y="244" width="104" height="28"/>
    <text x="294" y="263" class="small">Prioridad media</text>

    <rect class="alert" x="28" y="326" width="374" height="38"/>
    <text x="46" y="350" class="muted">Validar rangos de 1 a 10 antes de confirmar</text>
    <rect class="buttonSecondary" x="208" y="380" width="84" height="30"/>
    <text x="230" y="400" class="text">Volver</text>
    <rect class="button" x="304" y="380" width="98" height="30"/>
    <text x="326" y="400" class="whiteSmall">Confirmar</text>
  </g>

  <!-- 05 Confirmed task -->
  <g id="screen-confirmed" transform="translate(968 560)">
    <rect class="screen" width="430" height="420"/>
    <rect class="appbar" width="430" height="52" rx="8"/>
    <text x="20" y="32" class="white">Tarea confirmada</text>
    <text x="28" y="84" class="title">TaskConfirmedSummary</text>
    <text x="28" y="106" class="muted">Feedback claro antes de volver al listado</text>

    <rect class="success" x="28" y="132" width="374" height="54"/>
    <text x="48" y="164" class="text">Snackbar: tarea creada correctamente</text>

    <rect class="paper" x="28" y="212" width="374" height="122"/>
    <text x="48" y="242" class="subtitle">Preparar presentacion</text>
    <text x="48" y="266" class="muted">Pendiente - creado ahora</text>
    <line class="line" x1="48" y1="286" x2="382" y2="286"/>
    <text x="48" y="314" class="text">ICE 336</text>
    <rect class="chipMid" x="270" y="296" width="112" height="26"/>
    <text x="290" y="314" class="small">Prioridad media</text>

    <rect class="buttonSecondary" x="28" y="360" width="148" height="36"/>
    <text x="50" y="383" class="text">Crear otra tarea</text>
    <rect class="button" x="218" y="360" width="184" height="36"/>
    <text x="250" y="383" class="whiteSmall">Volver al listado</text>
  </g>
</svg>
